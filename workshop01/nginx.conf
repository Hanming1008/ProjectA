user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 768;
}

http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;

    upstream apps {
        least_conn;

        server 139.59.118.218:32770;
        server 139.59.118.218:32768;
        server 139.59.118.218:32769;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://apps;
        }
    }
}
